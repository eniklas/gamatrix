name: Feature request
description: Suggest an improvement to Gamatrix.
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Gamatrix.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need or limitation you are experiencing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe how you would like Gamatrix to address the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative approaches you have tried.
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, links, or other relevant details.

